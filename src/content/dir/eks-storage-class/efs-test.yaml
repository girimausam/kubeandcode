apiVersion: v1
kind: Pod
metadata:
  name: efs-writer
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "echo hello from pod A > /data/shared.txt && sleep 3600"]
    volumeMounts:
    - mountPath: /data
      name: efs-vol
  volumes:
  - name: efs-vol
    persistentVolumeClaim:
      claimName: my-efs-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-reader
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - mountPath: /data
      name: efs-vol
  volumes:
  - name: efs-vol
    persistentVolumeClaim:
      claimName: my-efs-pvc
