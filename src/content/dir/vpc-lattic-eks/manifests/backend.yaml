apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-backend
  namespace: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-backend
  template:
    metadata:
      labels:
        app: catalog-backend
    spec:
      containers:
        - name: catalog-backend
          image: 271995869266.dkr.ecr.us-east-1.amazonaws.com/app/backend:v1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-backend
  namespace: backend
spec:
  selector:
    app: catalog-backend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-backend-route
  namespace: backend
spec:
  parentRefs:
    - name: lattice-gateway
      namespace: networking
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /catalog
      backendRefs:
        - name: catalog-backend
          port: 80
---
apiVersion: application-networking.k8s.aws/v1alpha1
kind: TargetGroupPolicy
metadata:
  name: catalog-backend-policy
  namespace: backend
spec:
  targetRef:
    group: ""
    kind: Service
    name: catalog-backend
  protocol: HTTP
  protocolVersion: HTTP1
  healthCheck:
    enabled: true
    path: /health
    port: 8080
    intervalSeconds: 30
    healthyThresholdCount: 3
    unhealthyThresholdCount: 3
